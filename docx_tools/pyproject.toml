[project]
name = "docx_tools"
version = "1.0.3"
description = "A Python package for handling and processing DOCX files efficiently."
authors = [
    { name = "Matt Daly", email = "" },
]
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.12"
keywords = ["docx", "word-processing", "python", "pandoc"]
dependencies = [
    "click>=8.4.2",
    "docxcompose>=2.2.0",
    "lxml>=6.1.1",
    "pyyaml>=6.0.3",
]

[build-system]
requires = ["uv_build>=0.7.19,<0.8.0"]
build-backend = "uv_build"

[project.scripts]
docx_tools = "docx_tools:inject_properties.cli"

[dependency-groups]
dev = [
    "faker>=40.28.1",
    "pytest>=9.1.1",
    "pytest-click>=1.1.0",
]

[tool.ruff]
# Exclude a variety of commonly ignored directories.
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".hg",
    ".ipynb_checkpoints",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pyenv",
    ".pytest_cache",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    ".vscode",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "site-packages",
    "venv",
]

line-length = 140
indent-width = 4

[tool.ruff.lint]
# Enable Pyflakes (`F`) and a subset of the pycodestyle (`E`) codes by default.
# Unlike Flake8, Ruff doesn't enable pycodestyle warnings (`W`) or
# McCabe complexity (`C901`) by default.
select = [
    "E",
    "F",
    "PLC"
]
ignore = []





