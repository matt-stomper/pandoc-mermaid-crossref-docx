x-shared-defaults: &defaults
    platform: linux/amd64
    build:
      context: .
    image: mattstomper/puppeteer-pandoc-mermaid-crossref:1.1.0-rc7

services:
  pandoc-mermaid-crossref:
    <<: *defaults
    entrypoint: ./svd.sh
    working_dir: /home/node/data/svd_example
    volumes:
      - ../svd_example:/home/node/data/svd_example

  default-doc:
    <<: *defaults
    working_dir: /home/node/data/svd_example
    volumes:
      - ../svd_example:/home/node/data/svd_example
    entrypoint:
      - /bin/sh
      - -c
      - pandoc --reference-doc /home/node/data/svd_example/default.docx

  bash:
    <<: *defaults
    entrypoint: /bin/bash
