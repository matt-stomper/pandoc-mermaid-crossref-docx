[project]
name = "docx_tools"
version = "1.0.2"
description = "A Python package for handling and processing DOCX files efficiently."
authors = [
    { name = "Matt Daly", email = "" },
]
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.13"
keywords = ["docx", "word-processing", "python", "pandoc"]
dependencies = [
    "babel~=2.18.0",
    "click~=8.3.3",
    "docxcompose~=2.1.0",
    "lxml~=6.1.0",
    "pandoc-acro~=0.10.1",
    "pandoc-include~=1.4.3",
    "pyyaml~=6.0.3",
    "python-docx~=1.2.0",
    "six~=1.17.0",
    "typing_extensions~=4.15.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.3",
    "pytest-click",
    "black>=23.9",
    "flake8>=6.1",
    "mypy>=1.5"
]

[build-system]
requires = ["hatchling>=1.15"]
build-backend = "hatchling.build"